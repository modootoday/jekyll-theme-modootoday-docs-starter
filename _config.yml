title: Example Docs
description: A neutral example site for jekyll-theme-modootoday.
lang: en
remote_theme: modootoday/jekyll-theme-modootoday@v1.6.0
plugins: [jekyll-remote-theme]
markdown: kramdown
sass: {silence_deprecations: [import, global-builtin]}  # Dart Sass (Jekyll 4); ignored by GitHub Pages
kramdown: {input: GFM, syntax_highlighter: rouge}
permalink: pretty
# Logo and favicon from the modootoday mark (or a path to your own image): modootoday: {logo: brand, favicon: brand}
exclude: [Gemfile, Gemfile.lock, README.md]
modootoday:
  # The languages of the en, ko/ and ja/ pages, with a switcher in the header.
  languages: [en, ko, ja]
  language_switcher: header
  # Theme scripts load as files, with no inline script, so the site works under a strict Content-Security-Policy.
  csp: strict
  # One page per record of _data/plugins.json, written by: modootoday-stubs . --records --write
  records:
    plugins: {title: name, description: summary, facts: [category, version, tags], body: readme}
defaults:
  - {scope: {path: ""}, values: {layout: doc}}
  - {scope: {path: "ko"}, values: {lang: ko}}
  - {scope: {path: "ja"}, values: {lang: ja}}
